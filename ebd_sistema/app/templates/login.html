{% extends "base.html" %}

{% block title %}Login - Escola Dominical{% endblock %}

{% block content %}
<div class="flex items-center justify-center min-h-[75vh]">
    <div class="w-full max-w-md bg-white p-8 rounded-xl shadow-lg border border-slate-200">
        
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-slate-800">Escola Dominical</h1>
            <p class="text-sm text-slate-500 mt-1">Acesse sua conta para continuar</p>
        </div>

        {% if erro %}
        <div class="mb-4 p-3 bg-red-100 border-l-4 border-red-500 text-red-700 text-sm rounded">
            {{ erro }}
        </div>
        {% endif %}

        <form action="/auth/login" method="POST" class="space-y-4">
            <div>
                <label for="email" class="block text-sm font-medium text-slate-700 mb-1">E-mail</label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    required 
                    placeholder="seu.email@igreja.com"
                    class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none transition"
                >
            </div>

            <div>
                <label for="senha" class="block text-sm font-medium text-slate-700 mb-1">Senha</label>
                <input 
                    type="password" 
                    id="senha" 
                    name="senha" 
                    required 
                    placeholder="••••••••"
                    class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none transition"
                >
            </div>

            <button 
                type="submit" 
                class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 rounded-lg shadow transition duration-200"
            >
                Entrar no Sistema
            </button>
        </form>

    </div>
</div>
{% endblock %}
