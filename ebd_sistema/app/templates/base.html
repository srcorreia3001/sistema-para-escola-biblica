<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sistema EBD{% endblock %}</title>
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex flex-col">

    <!-- Menu Superior (se o usuário estiver logado) -->
    {% if usuario_logado %}
        {% include "components/navbar.html" %}
    {% endif %}

    <!-- Conteúdo Principal -->
    <main class="flex-grow container mx-auto px-4 py-6">
        {% block content %}{% endblock %}
    </main>

    <footer class="bg-slate-800 text-white text-center py-3 text-sm">
        <p>Sistema de Gestão - Escola Dominical &copy; 2026</p>
    </footer>

</body>
</html>
